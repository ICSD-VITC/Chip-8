/* ============================================================================
 * Keil µVision Debugger Signal Script for 4x4 Keypad Interfacing
 * Tests all 16 keys: '0' through 'F' across 4 Rows and 4 Columns
 * ============================================================================ */

// Signal function to simulate physical matrix button press
signal void press_matrix_key(unsigned char target_row, unsigned char target_col) {
    unsigned int i;

    // 1. Ensure keypad is initially released (let K1 release check pass)
    P0 = 0xFF;
    swatch(0.06); // Wait 60ms

    // 2. Simulate holding key down for 100ms (covers 20ms debounce + row scan)
    for (i = 0; i < 100; i++) {
        // If MCU grounds all rows (0x00) or grounds the specific target row bit
        if ((P1 == 0x00) || ((P1 & (1 << target_row)) == 0)) {
            P0 = ~(1 << target_col); // Connect column line to ground
        } else {
            P0 = 0xFF;
        }
        swatch(0.001); // Step 1ms
    }

    // 3. Release key
    P0 = 0xFF;
    swatch(0.06); // Wait 60ms between keypresses
}

// Main Test Suite iterating through all 16 key combinations
signal void test_all_16_keys() {
    printf("\n=========================================\n");
    printf("   STARTING ALL 16 KEYPAD COMBINATIONS   \n");
    printf("=========================================\n");

    // Row 0 Tests
    printf("Testing Row 0 -> Expected: '0', '1', '2', '3'\n");
    press_matrix_key(0, 0); // Key '0'
    press_matrix_key(0, 1); // Key '1'
    press_matrix_key(0, 2); // Key '2'
    press_matrix_key(0, 3); // Key '3'

    // Row 1 Tests
    printf("Testing Row 1 -> Expected: '4', '5', '6', '7'\n");
    press_matrix_key(1, 0); // Key '4'
    press_matrix_key(1, 1); // Key '5'
    press_matrix_key(1, 2); // Key '6'
    press_matrix_key(1, 3); // Key '7'

    // Row 2 Tests
    printf("Testing Row 2 -> Expected: '8', '9', 'A', 'B'\n");
    press_matrix_key(2, 0); // Key '8'
    press_matrix_key(2, 1); // Key '9'
    press_matrix_key(2, 2); // Key 'A'
    press_matrix_key(2, 3); // Key 'B'

    // Row 3 Tests
    printf("Testing Row 3 -> Expected: 'C', 'D', 'E', 'F'\n");
    press_matrix_key(3, 0); // Key 'C'
    press_matrix_key(3, 1); // Key 'D'
    press_matrix_key(3, 2); // Key 'E'
    press_matrix_key(3, 3); // Key 'F'

    printf("\n=========================================\n");
    printf("     ALL 16 KEYPAD TESTS COMPLETED       \n");
    printf("=========================================\n");
}

// Automatically execute test sequence upon load
test_all_16_keys();
